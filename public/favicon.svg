<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Paper background with crisp ink frame -->
  <rect x="2" y="2" width="60" height="60" fill="#f6f3ec" stroke="#121211" stroke-width="3.5"/>
  <rect x="6" y="6" width="52" height="52" stroke="#121211" stroke-width="0.9" stroke-opacity="0.3"/>

  <!-- Clean Calligraphic / Engraving 'C' (no inner hatch lines) -->
  <path
    d="M 38 15 C 20 10.5, 9.5 21, 9.5 33.5 C 9.5 45.5, 19.5 54, 37 49.5"
    stroke="#121211"
    stroke-width="3.8"
    stroke-linecap="round"
  />

  <!-- Italic Slanted 'R' fused with the 'C' -->
  <!-- Slanted stem of italic R (tilted ~15 degrees) -->
  <line x1="27" y1="17" x2="19.5" y2="49" stroke="#121211" stroke-width="3.4" stroke-linecap="round"/>
  <!-- Italic serif caps -->
  <line x1="23.5" y1="17" x2="30.5" y2="17" stroke="#121211" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="16" y1="49" x2="23.5" y2="49" stroke="#121211" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Italic R upper bowl -->
  <path
    d="M 27 17.5 H 35.5 C 43 17.5, 41.5 31.5, 32 31.5 H 23.5"
    stroke="#121211"
    stroke-width="3.1"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Italic R flowing curved leg with hook tail -->
  <path
    d="M 30.5 31.5 C 34.5 36, 37.5 44, 41.5 48.5 C 43 50, 45 50, 47 48"
    stroke="#121211"
    stroke-width="3.3"
    stroke-linecap="round"
  />

  <!-- Superscript Exponent '2' (C²R) -->
  <path
    d="M 44.5 14 C 45 10.8, 51.8 10.8, 51.2 14.6 C 50.6 17.5, 43.5 20.2, 43 23.2 H 51"
    stroke="#121211"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
